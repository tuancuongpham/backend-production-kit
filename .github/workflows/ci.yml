name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Fast, no services: what a pull request gets told first.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate skills, links, eval sets and shared-kernel copies
        run: npm run validate
      - name: Type-check the reference code, tests and benchmarks (Node strips types without checking them)
        run: npm run typecheck
      - name: Lint for bug classes (floating promises, missing awaits, inexhaustive switches)
        run: npm run lint
      - name: Tests that need no infrastructure
        run: npm run test:unit

  verify:
    needs: check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: kit
          POSTGRES_PASSWORD: kit
          POSTGRES_DB: kit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kit -d kit"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
      # resilience-testing: the tests proxy postgres:5432 and redis:6379 (service names) through these ports
      toxiproxy:
        image: ghcr.io/shopify/toxiproxy:2.9.0
        ports:
          - 8474:8474
          - 55440:55440
          - 63800:63800
    env:
      KIT_PG_URL: postgres://kit:kit@localhost:5432/kit
      KIT_REDIS_URL: redis://localhost:6379
      KIT_TOXIPROXY_URL: http://localhost:8474
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # the reference code is .ts run directly by Node's type stripping
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Every test against real Postgres, Redis and Toxiproxy, with coverage thresholds
        run: npm run coverage

      - name: Benchmarks (informational)
        run: node bench/run.ts ci
