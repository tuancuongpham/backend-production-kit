name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-skills:
    # frontmatter rules enforced on skill upload, links, eval sets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate skills, links and eval sets
        run: node scripts/validate-skills.mjs

  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: kit
          POSTGRES_PASSWORD: kit
          POSTGRES_DB: kit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kit -d kit"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      KIT_PG_URL: postgres://kit:kit@localhost:5432/kit
      KIT_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # the reference code is .ts run directly by Node's type stripping
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verification tests (real Postgres + Redis)
        run: npm test

      - name: Benchmarks (informational)
        run: node bench/run.ts ci
