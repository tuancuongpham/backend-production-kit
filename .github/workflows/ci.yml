name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-skills:
    # frontmatter rules enforced on skill upload, links, eval sets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Validate skills, links and eval sets
        run: node scripts/validate-skills.mjs

  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: kit
          POSTGRES_PASSWORD: kit
          POSTGRES_DB: kit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kit -d kit"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
      # resilience-testing: the tests proxy postgres:5432 and redis:6379 (service names) through these ports
      toxiproxy:
        image: ghcr.io/shopify/toxiproxy:2.9.0
        ports:
          - 8474:8474
          - 55440:55440
          - 63800:63800
    env:
      KIT_PG_URL: postgres://kit:kit@localhost:5432/kit
      KIT_REDIS_URL: redis://localhost:6379
      KIT_TOXIPROXY_URL: http://localhost:8474
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # the reference code is .ts run directly by Node's type stripping
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check the reference code (Node strips types without checking them)
        run: npm run typecheck

      - name: Verification tests (real Postgres + Redis)
        run: npm test

      - name: Benchmarks (informational)
        run: node bench/run.ts ci
