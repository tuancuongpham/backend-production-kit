# Throwaway infra for running the kit's verification tests.
# Non-default host ports so it doesn't collide with a local Postgres/Redis.
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: kit
      POSTGRES_PASSWORD: kit
      POSTGRES_DB: kit
    ports:
      - "55439:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kit -d kit"]
      interval: 2s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "63799:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

  # Fault injection (resilience-testing): tests create proxies to postgres:5432 and redis:6379 on the ports below
  # and add latency, resets or black holes through the API.
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.9.0
    ports:
      - "58474:8474"   # API
      - "55440:55440"  # → postgres
      - "63800:63800"  # → redis
